name: 'Reactor Core Stats'
description: 'Render your GitHub activity (contributions and languages) as an animated RBMK reactor-core SVG badge.'
author: 'markdown-rbmk'
branding:
  icon: 'activity'
  color: 'green'
inputs:
  username:
    description: 'GitHub username to collect stats for. Defaults to the repository owner.'
    required: false
  mode:
    description: 'Badge mode: commit (contribution heatmap), language (language rings) or hybrid.'
    required: false
    default: 'commit'
  scope:
    description: 'public (REST, public repos only) or all (GraphQL, includes private repos — needs a PAT). Used by language/hybrid modes.'
    required: false
    default: 'public'
  output_path:
    description: 'Path to write the generated SVG file.'
    required: false
    default: 'reactor-core.svg'
  theme:
    description: 'Badge theme: dark or light.'
    required: false
    default: 'dark'
  max_repos:
    description: 'Maximum number of repositories to scan (1-1000).'
    required: false
    default: '100'
  days:
    description: 'Recent contribution days to show in commit/hybrid modes (30-728).'
    required: false
    default: '470'
  langs:
    description: 'Languages listed before "Other" in language/hybrid modes (1-8).'
    required: false
    default: '4'
  exclude:
    description: 'Comma-separated languages to leave out, e.g. "HTML, Jupyter Notebook" (case-insensitive).'
    required: false
    default: ''
  forks:
    description: 'Include forked repositories (true/false).'
    required: false
    default: 'false'
  archived:
    description: 'Include archived repositories (true/false).'
    required: false
    default: 'true'
outputs:
  svg_path:
    description: 'Path of the generated SVG file.'
runs:
  using: 'node24'
  main: 'dist/index.js'
